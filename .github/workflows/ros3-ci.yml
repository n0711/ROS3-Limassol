name: ROS3-Limassol

on:
  push:
    paths:
      - 'robotics/**'
      - '.github/workflows/ros3-ci.yml'
      - 'pytest.ini'
  pull_request:
    paths:
      - 'robotics/**'
      - '.github/workflows/ros3-ci.yml'
      - 'pytest.ini'

permissions:
  contents: read

jobs:
  core:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.10'
          - os: ubuntu-24.04
            python: '3.12'
          - os: windows-latest
            python: '3.12'
    defaults:
      run:
        working-directory: robotics/ros3_limassol
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Core tests and deterministic scenario
        run: |
          python -m unittest discover -s tests -v
          python -m ros3_limassol.demo
          python -m compileall -q ros3_limassol launch tests tools
      - name: Verify installed wheel
        run: |
          python -m pip install setuptools wheel
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .
          python tools/check_wheel.py

  ros-jazzy:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install test and launch tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-colcon-common-extensions python3-pytest ros-jazzy-launch-ros ros-jazzy-rclpy ros-jazzy-std-msgs
      - name: Build ROS package and run the DDS test
        run: |
          source /opt/ros/jazzy/setup.bash
          python3 -c 'import rclpy; import launch_ros; import std_msgs'
          colcon build --base-paths robotics --packages-select ros3_limassol --symlink-install
          source install/setup.bash
          ros2 launch ros3_limassol usv_demo.launch.py --show-args
          colcon test --packages-select ros3_limassol --event-handlers console_direct+
          colcon test-result --verbose
