name: ROS3 Rust core
on:
  push:
    paths: ['robotics/ros3_core/**', 'robotics/ros3_limassol/ros3_limassol/**', '.github/workflows/ros3-rust.yml']
  pull_request:
    paths: ['robotics/ros3_core/**', 'robotics/ros3_limassol/ros3_limassol/**', '.github/workflows/ros3-rust.yml']
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo fmt --manifest-path robotics/ros3_core/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path robotics/ros3_core/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path robotics/ros3_core/Cargo.toml
      - run: cargo build --locked --manifest-path robotics/ros3_core/Cargo.toml
      - run: python robotics/ros3_core/tests/parity.py robotics/ros3_core/target/debug/ros3-core
