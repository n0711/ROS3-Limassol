name: Validate optional GitLab CI configuration

on:
  push:
    paths:
      - '.gitlab-ci.yml'
      - 'tools/validate_gitlab_ci.py'
      - 'tests/test_gitlab_ci_config.py'
      - '.github/workflows/gitlab-ci-smoke.yml'
  pull_request:
    paths:
      - '.gitlab-ci.yml'
      - 'tools/validate_gitlab_ci.py'
      - 'tests/test_gitlab_ci_config.py'
      - '.github/workflows/gitlab-ci-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-gitlab-ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the YAML parser
        run: python -m pip install PyYAML==6.0.2
      - name: Parse GitLab YAML and verify CI job coverage
        run: python tools/validate_gitlab_ci.py
      - name: Test CI validation failure cases
        run: python -m unittest discover -s tests -p 'test_gitlab_ci_config.py' -v
