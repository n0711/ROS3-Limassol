name: LearnTwin frontend

on:
  push:
    paths:
      - 'frontend/**'
      - 'KNOWN_ISSUES.md'
      - '.github/workflows/learntwin-frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'KNOWN_ISSUES.md'
      - '.github/workflows/learntwin-frontend.yml'

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Contract and planner unit tests
        run: npm test
      - name: ESLint
        run: npm run lint
      - name: Production build
        run: npm run build
